name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install larzscript
        run: curl -fsSL https://raw.githubusercontent.com/larz-scripter/larzscript/main/install.sh | sh
      - name: install packages this project uses
        run: |
          mkdir -p ~/.larzscript/lib
          for pkg in cli args table; do
            curl -fsSL "https://raw.githubusercontent.com/larz-scripter/larzscript-packages/master/packages/$pkg/main.lz" -o ~/.larzscript/lib/"$pkg".lz
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: syntax check
        run: larzscript --check langton.lz
      - name: run tests
        run: sh tests/run_tests.sh
